name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      # Only codelens-gui (internal/gui) needs these: it's a CGO build using
      # Fyne's native (non-web) GUI toolkit, which links against the system
      # OpenGL/X11 libraries. codelens itself stays a CGO-free static binary.
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgl1-mesa-dev xorg-dev

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build codelens (CGO-free CLI)
        run: CGO_ENABLED=0 go build ./cmd/codelens

      - name: Build codelens-gui (native desktop app)
        run: go build ./cmd/codelens-gui
